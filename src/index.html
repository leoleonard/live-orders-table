<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Zlecenia</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Apply the theme before first paint to avoid a light flash; ThemeStore takes over afterwards.
      (function () {
        try {
          var stored = localStorage.getItem('orders-app.theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
