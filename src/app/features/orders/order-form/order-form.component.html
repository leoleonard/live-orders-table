<form class="order-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <h2 class="order-form__title">New order</h2>

  <div class="fields">
    <label class="field">
      <span class="field__label">Symbol</span>
      <select formControlName="symbol" [class.invalid]="showError('symbol')">
        <option value="" disabled>— select —</option>
        @for (symbol of symbols(); track symbol) {
          <option [value]="symbol">{{ symbol }}</option>
        }
      </select>
      @if (showError('symbol')) {
        <span class="field__error">Select a symbol.</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Side</span>
      <select formControlName="side">
        @for (side of sides; track side) {
          <option [value]="side">{{ side }}</option>
        }
      </select>
    </label>

    <label class="field">
      <span class="field__label">Size</span>
      <input
        type="number"
        formControlName="size"
        min="0"
        step="any"
        inputmode="decimal"
        [class.invalid]="showError('size')"
      />
      @if (showError('size')) {
        <span class="field__error">Enter a number greater than 0.</span>
      }
    </label>

    <label class="field">
      <span class="field__label">
        Open price
        @if (currentBid() !== null) {
          <button
            type="button"
            class="link"
            (click)="useCurrentPrice()"
            title="Use the current bid price"
          >
            bid: {{ currentBid() | number: '1.2-5' }}
          </button>
        }
      </span>
      <input
        type="number"
        formControlName="openPrice"
        min="0"
        step="any"
        inputmode="decimal"
        [class.invalid]="showError('openPrice')"
      />
      @if (showError('openPrice')) {
        <span class="field__error">Enter a price greater than 0.</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Open time</span>
      <input
        type="datetime-local"
        step="1"
        formControlName="openTime"
        [class.invalid]="showError('openTime')"
      />
      @if (showError('openTime')) {
        <span class="field__error">Enter the open time.</span>
      }
    </label>
  </div>

  <div class="actions">
    <button type="submit" class="btn btn--primary">Add order</button>
    <button type="button" class="btn" (click)="reset()">Clear</button>
  </div>
</form>
